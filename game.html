<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Спортивный детектив | Жлобин-Спорт</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="game.css">
    <style>
    body { background: radial-gradient(circle at top, #1b2942, #101a2e) !important; color: #f4f7ff !important; }
    .detective-page { padding: 120px 20px 60px; max-width: 900px; margin: 0 auto; }
    .detective-header h1 { color: #ffd700 !important; font-size: 2.5rem; }
    .case-container { background: #1b2942 !important; border: 1px solid #33435f !important; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .case-info { color: #ffd700 !important; border-bottom: 2px solid #33435f !important; }
    .case-text { color: #dbe6f7 !important; }
    .question-area { background: #14213d !important; border: 1px solid #33435f !important; border-radius: 16px; padding: 25px; }
    .question-area h2 { color: #f4f7ff !important; }
    .question-area button, .option-btn { background: #243654 !important; border: 2px solid #33435f !important; color: #f4f7ff !important; padding: 15px 20px !important; border-radius: 12px !important; text-align: left !important; width: 100% !important; margin-bottom: 12px !important; font-weight: 600 !important; cursor: pointer; transition: 0.2s; }
    .question-area button:hover, .option-btn:hover { border-color: #ffd700 !important; background: #2a3f63 !important; }
    .evidence-slot { background: #14213d !important; border: 2px dashed #33435f !important; color: #53627f !important; }
  </style>
</head>
<body>
  <div class="detective-page">
    <a href="index.html" class="back-btn">← На главную</a>
    
    <div class="detective-header">
      <h1>🕵️‍♂️ Спортивный детектив</h1>
      <p>Тайны белорусского золота</p>
    </div>

    <div class="case-container">
      <div class="case-info">
        <span id="levelTitle">Дело №1: Пропавший молот</span>
        <span id="progress">Улики: 0 / 3</span>
      </div>

      <div class="case-text" id="caseText">
        <!-- Текст завязки будет здесь -->
      </div>

      <div class="evidence-board" id="evidenceBoard">
        <!-- Улики будут появляться здесь -->
      </div>

      <div class="question-area">
        <h2 id="questionText">Вопрос</h2>
        <div class="options" id="optionsContainer">
          <!-- Варианты ответов -->
        </div>
      </div>

      <div class="result-message" id="resultMessage"></div>
      <button id="nextLevelBtn" class="btn" style="display: none;">Следующее дело →</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
