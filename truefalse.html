<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детектор лжи | Жлобин-Спорт</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
    <style>
    body { background: linear-gradient(135deg, #fff0f5 0%, #ffe4e1 100%); }
    [data-theme="dark"] body { background: linear-gradient(135deg, #2d1b2e 0%, #1a0f1a 100%); }
    
    .game-page { padding: 100px 20px 60px; max-width: 800px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Верхняя панель с таймером и очками */
    .game-header { background: #ffffff; color: #ec4899; border: 2px solid #fbcfe8; padding: 20px 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(236, 72, 153, 0.15); margin-bottom: 30px; font-weight: 900; font-size: 1.2rem; display: flex; justify-content: space-between; }
    
    /* Объемные кнопки правда/вымысел */
    .btn-true { background: linear-gradient(135deg, #22c55e, #16a34a) !important; box-shadow: 0 8px 0 #15803d, 0 10px 20px rgba(34, 197, 94, 0.4) !important; border: none !important; transition: transform 0.1s, box-shadow 0.1s !important; }
    .btn-true:active { transform: translateY(6px); box-shadow: 0 2px 0 #15803d !important; }
    
    .btn-false { background: linear-gradient(135deg, #ef4444, #dc2626) !important; box-shadow: 0 8px 0 #991b1b, 0 10px 20px rgba(239, 68, 68, 0.4) !important; border: none !important; transition: transform 0.1s, box-shadow 0.1s !important; }
    .btn-false:active { transform: translateY(6px); box-shadow: 0 2px 0 #991b1b !important; }

    /* Карточка с фактом */
    .fact-card { background: #ffffff; border: 3px solid #fbcfe8; padding: 40px 30px; border-radius: 24px; text-align: center; box-shadow: 0 15px 35px rgba(236, 72, 153, 0.1); margin-bottom: 30px; flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 800; color: #4a044e; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); transform-style: preserve-3d; }
    .fact-card.correct { background: linear-gradient(135deg, #dcfce7, #bbf7d0); border-color: #22c55e; color: #166534; transform: scale(1.02); }
    .fact-card.incorrect { background: linear-gradient(135deg, #fee2e2, #fecaca); border-color: #ef4444; color: #991b1b; transform: scale(0.98); }
    
    .explanation { font-size: 1.1rem; font-weight: 700; margin-top: 20px; padding: 15px; border-radius: 12px; background: #fdf2f8; border: 2px dashed #fbcfe8; color: #4a044e; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <img src="gerb.jpg" alt="Герб" class="logo__badge" style="width: 40px; height: 40px; object-fit: contain; padding: 4px; border-radius: 12px;">
        <span>Жлобин<b>·</b>Спорт</span>
      </a>
      <nav class="nav"><a href="index.html">← На главную</a></nav>
    </div>
  </header>

  <div class="game-page">
    <div id="startScreen" style="text-align: center; background: var(--card); padding: 50px 30px; border-radius: 24px; box-shadow: var(--shadow);">
      <h1 style="font-size: 2.5rem; color: var(--primary); margin-bottom: 20px;">🕵️ Детектор лжи</h1>
      <p style="font-size: 1.2rem; margin-bottom: 30px; color: var(--text-muted);">У тебя есть 2 минуты. На экране будут появляться факты о спорте. Твоя задача — угадать, правда это или вымысел. За каждый правильный ответ +1 балл!</p>
      <button class="btn" onclick="startDetector()" style="font-size: 1.2rem; padding: 20px 40px;">Начать игру</button>
    </div>

    <div id="gameScreen" style="display: none; flex-direction: column; flex-grow: 1;">
      <div class="game-header">
        <div>⏱️ <span id="detectiveTime">120</span> сек</div>
        <div>⭐ <span id="detectiveScore">0</span> очков</div>
      </div>
      
      <div class="fact-card" id="factText"></div>
      
      <div class="btn-group" id="answerBtns">
        <button class="btn btn-true" onclick="checkFact(true)">✅ Правда</button>
        <button class="btn btn-false" onclick="checkFact(false)">❌ Вымысел</button>
      </div>
      
      <div class="explanation" id="explanationText"></div>
    </div>

    <div id="endScreen" style="display: none; text-align: center; background: var(--card); padding: 50px 30px; border-radius: 24px; box-shadow: var(--shadow);">
      <h1 style="font-size: 2.5rem; color: var(--primary); margin-bottom: 20px;">Игра окончена!</h1>
      <p style="font-size: 1.5rem; margin-bottom: 20px;">Твой результат: <strong id="finalScore">0</strong> очков</p>
      <p style="font-size: 1.2rem; margin-bottom: 30px; color: var(--text-muted);" id="finalRank">Звание</p>
      <button class="btn" onclick="startDetector()" style="font-size: 1.2rem; padding: 20px 40px;">Играть заново</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
