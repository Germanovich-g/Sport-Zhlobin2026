<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Детектор лжи | Жлобин-Спорт</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .game-page { padding: 120px 20px 60px; max-width: 800px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .game-header { display: flex; justify-content: space-between; background: var(--card); padding: 20px 30px; border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 30px; font-weight: 900; font-size: 1.2rem; }
    .fact-card { background: var(--card); border: 2px solid var(--border); padding: 40px 30px; border-radius: 24px; text-align: center; box-shadow: var(--shadow); margin-bottom: 30px; flex-grow: 1; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; font-weight: 700; transition: 0.3s; position: relative; overflow: hidden; }
    .fact-card.correct { background: #dcfce7; border-color: #22c55e; color: #166534; }
    .fact-card.incorrect { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
    .btn-group { display: flex; gap: 20px; }
    .btn-group .btn { flex: 1; padding: 20px; font-size: 1.2rem; border-radius: 16px; }
    .btn-true { background: #22c55e !important; box-shadow: 0 10px 25px rgba(34, 197, 94, 0.3) !important; }
    .btn-false { background: #ef4444 !important; box-shadow: 0 10px 25px rgba(239, 68, 68, 0.3) !important; }
    .explanation { margin-top: 20px; font-size: 1.1rem; font-weight: 600; text-align: center; animation: fadeIn 0.4s ease-out; }
  </style>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">
        <img src="gerb.jpg" alt="Герб" class="logo__badge" style="width: 40px; height: 40px; object-fit: contain; padding: 4px; border-radius: 12px;">
        <span>Жлобин<b>·</b>Спорт</span>
      </a>
      <nav class="nav"><a href="index.html">← На главную</a></nav>
    </div>
  </header>

  <div class="game-page">
    <div id="startScreen" style="text-align: center; background: var(--card); padding: 50px 30px; border-radius: 24px; box-shadow: var(--shadow);">
      <h1 style="font-size: 2.5rem; color: var(--primary); margin-bottom: 20px;">🕵️ Детектор лжи</h1>
      <p style="font-size: 1.2rem; margin-bottom: 30px; color: var(--text-muted);">У тебя есть 2 минуты. На экране будут появляться факты о спорте. Твоя задача — угадать, правда это или вымысел. За каждый правильный ответ +1 балл!</p>
      <button class="btn" onclick="startDetector()" style="font-size: 1.2rem; padding: 20px 40px;">Начать игру</button>
    </div>

    <div id="gameScreen" style="display: none; flex-direction: column; flex-grow: 1;">
      <div class="game-header">
        <div>⏱️ <span id="detectiveTime">120</span> сек</div>
        <div>⭐ <span id="detectiveScore">0</span> очков</div>
      </div>
      
      <div class="fact-card" id="factText"></div>
      
      <div class="btn-group" id="answerBtns">
        <button class="btn btn-true" onclick="checkFact(true)">✅ Правда</button>
        <button class="btn btn-false" onclick="checkFact(false)">❌ Вымысел</button>
      </div>
      
      <div class="explanation" id="explanationText"></div>
    </div>

    <div id="endScreen" style="display: none; text-align: center; background: var(--card); padding: 50px 30px; border-radius: 24px; box-shadow: var(--shadow);">
      <h1 style="font-size: 2.5rem; color: var(--primary); margin-bottom: 20px;">Игра окончена!</h1>
      <p style="font-size: 1.5rem; margin-bottom: 20px;">Твой результат: <strong id="finalScore">0</strong> очков</p>
      <p style="font-size: 1.2rem; margin-bottom: 30px; color: var(--text-muted);" id="finalRank">Звание</p>
      <button class="btn" onclick="startDetector()" style="font-size: 1.2rem; padding: 20px 40px;">Играть заново</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
